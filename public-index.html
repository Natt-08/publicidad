<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festival AI - Inspiración Creativa</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 700px; display: flex; flex-direction: column; height: 90vh; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 24px; color: #38bdf8; }
    p.sub { color: #94a3b8; font-size: 14px; margin-top: 5px; }
    #chat { flex: 1; overflow-y: auto; background: #1e293b; padding: 15px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 12px 16px; border-radius: 10px; max-width: 85%; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
    .user { background: #0284c7; align-self: flex-end; color: white; }
    .bot { background: #334155; align-self: flex-start; color: #f1f5f9; }
    .input-box { display: flex; gap: 10px; margin-top: 15px; }
    input { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: white; font-size: 15px; }
    button { background: #38bdf8; color: #0f172a; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏆 Festival AI</h1>
      <p class="sub">Pregunta por insights, categorías o briefs basados en 300 campañas premiadas.</p>
    </header>
    <div id="chat">
      <div class="msg bot">¡Hola! Cuéntame qué brief tienes o qué tipo de referencias estás buscando hoy.</div>
    </div>
    <form class="input-box" id="form">
      <input type="text" id="pregunta" placeholder="Ej: Ideas para combatir el cambio climático..." required>
      <button type="submit" id="btn">Enviar</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('pregunta');
    const chat = document.getElementById('chat');
    const btn = document.getElementById('btn');

    form.onsubmit = async (e) => {
      e.preventDefault();
      const txt = input.value.trim();
      if (!txt) return;

      chat.innerHTML += `<div class="msg user">${txt}</div>`;
      input.value = '';
      btn.disabled = true;
      chat.scrollTop = chat.scrollHeight;

      const loading = document.createElement('div');
      loading.className = 'msg bot';
      loading.innerText = 'Buscando referencias ganadoras...';
      chat.appendChild(loading);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje: txt })
        });
        const data = await res.json();
        loading.innerText = data.respuesta || "Hubo un problema al responder.";
      } catch {
        loading.innerText = "Error de conexión.";
      }
      btn.disabled = false;
      chat.scrollTop = chat.scrollHeight;
    };
  </script>
</body>
</html>
