<script>
    const form = document.getElementById('form');
    const input = document.getElementById('pregunta');
    const chat = document.getElementById('chat');
    const btn = document.getElementById('btn');

    form.onsubmit = async (e) => {
      e.preventDefault();
      const txt = input.value.trim();
      if (!txt) return;

      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.innerText = txt;
      chat.appendChild(userDiv);

      input.value = '';
      btn.disabled = true;
      chat.scrollTop = chat.scrollHeight;

      const loading = document.createElement('div');
      loading.className = 'msg bot';
      loading.innerText = 'Consultando base de datos y redactando...';
      chat.appendChild(loading);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje: txt })
        });

        const rawText = await res.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch {
          throw new Error(`El servidor tardó demasiado y cortó la conexión (Timeout de Vercel).`);
        }

        if (!res.ok) {
          loading.innerText = `Error (${res.status}): ${data.error || 'Fallo en la consulta.'}`;
        } else {
          loading.innerHTML = marked.parse(data.respuesta || 'Sin respuesta.');
        }
      } catch (err) {
        loading.innerText = `Error: ${err.message}`;
      }

      btn.disabled = false;
      chat.scrollTop = chat.scrollHeight;
    };
  </script>
