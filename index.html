    function syncConfig() {
      document.getElementById('input-gemini').value = localStorage.getItem('festival_gemini') || '';
      document.getElementById('input-groq').value = localStorage.getItem('festival_groq') || '';
      document.getElementById('input-openrouter').value = localStorage.getItem('festival_or') || '';
      document.getElementById('select-strategy').value = localStorage.getItem('festival_strategy') || 'auto';
    }

    const modalSettings = document.getElementById('modal-settings');
    document.getElementById('btn-open-settings').onclick = () => modalSettings.classList.add('active');
    document.getElementById('btn-close-settings').onclick = () => modalSettings.classList.remove('active');
    
    document.getElementById('btn-save-settings').onclick = () => {
      localStorage.setItem('festival_gemini', document.getElementById('input-gemini').value.trim());
      localStorage.setItem('festival_groq', document.getElementById('input-groq').value.trim());
      localStorage.setItem('festival_or', document.getElementById('input-openrouter').value.trim());
      localStorage.setItem('festival_strategy', document.getElementById('select-strategy').value);
      modalSettings.classList.remove('active');
    };
