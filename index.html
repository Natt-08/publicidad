<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festival AI | Creative Benchmark & Strategy</title>
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-body: #07090e;
      --bg-surface: #0f141f;
      --bg-card: #161e2e;
      --border: #232f48;
      --border-focus: #38bdf8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --user-bubble: #0284c7;
      --bot-bubble: #111827;
      --badge-gemini: #10b981;
      --badge-openrouter: #8b5cf6;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 980px;
      height: 94vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 20, 31, 0.7);
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #07090e;
      font-size: 16px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .provider-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--bg-card);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
    }

    .btn-icon {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #chat-thread {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 88%;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 14.5px;
      line-height: 1.6;
      word-break: break-word;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .message.bot {
      align-self: flex-start;
      background: var(--bot-bubble);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
    }

    .bot h1, .bot h2, .bot h3 {
      color: var(--accent);
      margin: 16px 0 8px 0;
      font-weight: 700;
    }
    .bot h1 { font-size: 19px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .bot h2 { font-size: 16px; }
    .bot h3 { font-size: 14.5px; }
    .bot p { margin-bottom: 12px; }
    .bot p:last-child { margin-bottom: 0; }
    .bot strong { color: var(--accent); font-weight: 600; }
    .bot ul, .bot ol { margin: 8px 0 12px 22px; }
    .bot li { margin-bottom: 5px; }
    .bot hr { border: 0; height: 1px; background: var(--border); margin: 18px 0; }
    .bot a { color: var(--accent); text-decoration: underline; }

    .bot table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      font-size: 13.5px;
      background: #0b111a;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .bot th, .bot td {
      padding: 10px 14px;
      text-align: left;
      border: 1px solid var(--border);
    }
    .bot th {
      background: #141c2b;
      color: var(--accent);
      font-weight: 600;
    }
    .bot tr:nth-child(even) {
      background: #0f1523;
    }

    footer {
      padding: 16px 24px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
    }

    .input-bar {
      display: flex;
      gap: 12px;
    }

    #query-input {
      flex: 1;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #query-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #btn-send {
      padding: 0 24px;
      background: var(--accent);
      color: #07090e;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14.5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #btn-send:hover {
      background: var(--accent-hover);
    }

    #btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 480px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--border-focus);
    }

    .hint {
      font-size: 11.5px;
      color: var(--text-dim);
      margin-top: 5px;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .btn-save {
      background: var(--accent);
      color: #07090e;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--danger);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand">
        <div class="brand-logo">F</div>
        <div>
          <div class="brand-title">Festival AI</div>
          <div class="brand-subtitle">Benchmark Creativo & Jurado de Cannes</div>
        </div>
      </div>

      <div class="header-actions">
        <div class="provider-status" id="badge-provider">
          <span class="status-dot" id="status-dot"></span>
          <span id="provider-name">Sin configurar</span>
        </div>
        <button class="btn-icon" id="btn-open-settings">
          ⚙️ <span id="user-display">Configurar</span>
        </button>
      </div>
    </header>

    <main id="chat-thread">
      <div class="message bot">
        Base de datos lista. Configura tu API Key en la esquina superior (Gemini u OpenRouter) para comenzar a pelotear con tus propios tokens.
      </div>
    </main>

    <footer>
      <form class="input-bar" id="chat-form">
        <input 
          type="text" 
          id="query-input" 
          placeholder="Escribe un brief, territorio o pide un versus..." 
          autocomplete="off" 
          required
        />
        <button type="submit" id="btn-send">Enviar</button>
      </form>
    </footer>
  </div>

  <div class="modal-overlay" id="modal-settings">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">Configuración de Usuario</div>
        <button class="btn-close" id="btn-close-settings">&times;</button>
      </div>

      <div class="form-group">
        <label for="select-provider">Proveedor del Modelo:</label>
        <select id="select-provider" class="form-control">
          <option value="gemini">Google Gemini (Claves AIzaSy... o AQ...)</option>
          <option value="openrouter">OpenRouter (Claves sk-or-v1-...)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="input-apikey">Tu API Key Personal:</label>
        <input type="password" id="input-apikey" class="form-control" placeholder="Pega tu clave aquí" />
        <div class="hint">
          Guardada 100% de forma local en tu navegador (localStorage).
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-clear" id="btn-clear-settings">Borrar mis datos</button>
        <button type="button" class="btn-save" id="btn-save-settings">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <script>
    const chatThread = document.getElementById('chat-thread');
    const chatForm = document.getElementById('chat-form');
    const queryInput = document.getElementById('query-input');
    const btnSend = document.getElementById('btn-send');

    const modalSettings = document.getElementById('modal-settings');
    const btnOpenSettings = document.getElementById('btn-open-settings');
    const btnCloseSettings = document.getElementById('btn-close-settings');
    const btnSaveSettings = document.getElementById('btn-save-settings');
    const btnClearSettings = document.getElementById('btn-clear-settings');

    const selectProvider = document.getElementById('select-provider');
    const inputApiKey = document.getElementById('input-apikey');
    const userDisplay = document.getElementById('user-display');
    const providerName = document.getElementById('provider-name');
    const statusDot = document.getElementById('status-dot');

    function syncUserConfig() {
      const storedKey = localStorage.getItem('festival_api_key') || '';
      const storedProv = localStorage.getItem('festival_provider') || 'gemini';

      inputApiKey.value = storedKey;
      selectProvider.value = storedProv;

      if (storedKey) {
        userDisplay.innerText = 'Key Lista';
        if (storedProv === 'gemini') {
          providerName.innerText = 'Google Gemini (BYOK)';
          providerName.style.color = 'var(--badge-gemini)';
          statusDot.style.background = 'var(--badge-gemini)';
        } else {
          providerName.innerText = 'OpenRouter (BYOK)';
          providerName.style.color = 'var(--badge-openrouter)';
          statusDot.style.background = 'var(--badge-openrouter)';
        }
      } else {
        userDisplay.innerText = 'Configurar';
        providerName.innerText = 'Servidor Compartido';
        providerName.style.color = 'var(--text-muted)';
        statusDot.style.background = 'var(--text-dim)';
      }
    }

    btnOpenSettings.onclick = () => modalSettings.classList.add('active');
    btnCloseSettings.onclick = () => modalSettings.classList.remove('active');
    modalSettings.onclick = (e) => {
      if (e.target === modalSettings) modalSettings.classList.remove('active');
    };

    btnSaveSettings.onclick = () => {
      const keyVal = inputApiKey.value.trim();
      const provVal = selectProvider.value;

      if (keyVal) {
        localStorage.setItem('festival_api_key', keyVal);
        localStorage.setItem('festival_provider', provVal);
      } else {
        localStorage.removeItem('festival_api_key');
        localStorage.removeItem('festival_provider');
      }

      syncUserConfig();
      modalSettings.classList.remove('active');
    };

    btnClearSettings.onclick = () => {
      localStorage.removeItem('festival_api_key');
      localStorage.removeItem('festival_provider');
      inputApiKey.value = '';
      selectProvider.value = 'gemini';
      syncUserConfig();
      modalSettings.classList.remove('active');
    };

    chatForm.onsubmit = async (e) => {
      e.preventDefault();
      const query = queryInput.value.trim();
      if (!query) return;

      const userKey = localStorage.getItem('festival_api_key') || '';
      const userProv = localStorage.getItem('festival_provider') || 'gemini';

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerText = query;
      chatThread.appendChild(userMsg);

      queryInput.value = '';
      btnSend.disabled = true;
      chatThread.scrollTop = chatThread.scrollHeight;

      const botMsg = document.createElement('div');
      botMsg.className = 'message bot';
      botMsg.innerText = 'Analizando festivales y evaluando casos...';
      chatThread.appendChild(botMsg);
      chatThread.scrollTop = chatThread.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-key': userKey,
            'x-user-provider': userProv
          },
          body: JSON.stringify({ mensaje: query })
        });

        const rawText = await res.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch {
          throw new Error('El servidor tardó demasiado o devolvió una respuesta vacía.');
        }

        if (!res.ok) {
          botMsg.innerText = `Error (${res.status}): ${data.error || 'Error procesando la solicitud.'}`;
        } else {
          botMsg.innerHTML = marked.parse(data.respuesta || 'Sin respuesta del modelo.');
        }
      } catch (err) {
        botMsg.innerText = `Error de conexión: ${err.message}`;
      }

      btnSend.disabled = false;
      chatThread.scrollTop = chatThread.scrollHeight;
    };

    syncUserConfig();
  </script>
</body>
</html>
