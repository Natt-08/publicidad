<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festival AI - Benchmarking Creativo</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0b1329;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      height: 92vh;
    }
    header {
      text-align: center;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      color: #38bdf8;
    }
    p.sub {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 6px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      background: #152238;
      padding: 18px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border: 1px solid #1e293b;
    }
    .msg {
      padding: 14px 18px;
      border-radius: 10px;
      max-width: 88%;
      line-height: 1.55;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      background: #0284c7;
      align-self: flex-end;
      color: #ffffff;
    }
    .bot {
      background: #1e293b;
      align-self: flex-start;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    .bot a {
      color: #38bdf8;
      text-decoration: underline;
    }
    .input-box {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    input {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #152238;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      background: #38bdf8;
      color: #0b1329;
      border: none;
      padding: 0 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }
    button:hover {
      background: #7dd3fc;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Festival AI</h1>
      <p class="sub">Análisis estratégico y contraste de 300 campañas (Ganadoras vs. No ganadoras)</p>
    </header>

    <div id="chat">
      <div class="msg bot">Base de datos lista. Plantea un brief, un territorio de marca o una comparativa entre casos para iniciar el análisis.</div>
    </div>

    <form class="input-box" id="form">
      <input type="text" id="pregunta" placeholder="Escribe tu consulta o reto estratégico..." required autocomplete="off">
      <button type="submit" id="btn">Enviar</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('pregunta');
    const chat = document.getElementById('chat');
    const btn = document.getElementById('btn');

    form.onsubmit = async (e) => {
      e.preventDefault();
      const txt = input.value.trim();
      if (!txt) return;

      chat.innerHTML += `<div class="msg user">${txt}</div>`;
      input.value = '';
      btn.disabled = true;
      chat.scrollTop = chat.scrollHeight;

      const loading = document.createElement('div');
      loading.className = 'msg bot';
      loading.innerText = 'Razonando y analizando casos en la base de datos...';
      chat.appendChild(loading);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje: txt })
        });

        const data = await res.json();

        if (!res.ok) {
          loading.innerText = `Error (${res.status}): ${data.error || 'Error interno en el servidor.'}`;
        } else {
          const textoFormateado = (data.respuesta || 'Sin respuesta.')
            .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
          loading.innerHTML = textoFormateado;
        }
      } catch (err) {
        loading.innerText = `Error de red: ${err.message}`;
      }

      btn.disabled = false;
      chat.scrollTop = chat.scrollHeight;
    };
  </script>
</body>
</html>
