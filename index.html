<script>
    const form = document.getElementById('form');
    const input = document.getElementById('pregunta');
    const chat = document.getElementById('chat');
    const btn = document.getElementById('btn');

    form.onsubmit = async (e) => {
      e.preventDefault();
      const txt = input.value.trim();
      if (!txt) return;

      chat.innerHTML += `<div class="msg user">${txt}</div>`;
      input.value = '';
      btn.disabled = true;
      chat.scrollTop = chat.scrollHeight;

      const loading = document.createElement('div');
      loading.className = 'msg bot';
      loading.innerText = 'Analizando base de datos y redactando respuesta...';
      chat.appendChild(loading);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje: txt })
        });

        const data = await res.json();

        if (!res.ok) {
          loading.innerText = `Error (${res.status}): ${data.error || 'Fallo interno en el servidor.'}`;
        } else {
          loading.innerText = data.respuesta || 'Sin respuesta.';
        }
      } catch (err) {
        loading.innerText = `Error de conexión: ${err.message}`;
      }

      btn.disabled = false;
      chat.scrollTop = chat.scrollHeight;
    };
  </script>
