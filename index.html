<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festival AI - Benchmarking Estratégico</title>
  
  <!-- Parser de Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-main: #090d16;
      --bg-panel: #111827;
      --bg-bubble-user: #0284c7;
      --bg-bubble-bot: #1a2234;
      --border-color: #1f293d;
      --accent: #38bdf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      height: 92vh;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      background: var(--bg-panel);
      padding: 24px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .msg {
      padding: 16px 20px;
      border-radius: 12px;
      max-width: 90%;
      line-height: 1.6;
      font-size: 14.5px;
      word-break: break-word;
    }

    .user {
      background: var(--bg-bubble-user);
      align-self: flex-end;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: var(--bg-bubble-bot);
      align-self: flex-start;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    /* Formato de Markdown renderizado */
    .bot h1, .bot h2, .bot h3 {
      color: var(--accent);
      margin: 16px 0 8px 0;
      line-height: 1.3;
    }
    .bot h1 { font-size: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
    .bot h2 { font-size: 17px; }
    .bot h3 { font-size: 15px; }

    .bot p { margin-bottom: 10px; }
    .bot p:last-child { margin-bottom: 0; }

    .bot strong {
      color: #38bdf8;
      font-weight: 600;
    }

    .bot ul, .bot ol {
      margin-left: 20px;
      margin-bottom: 12px;
    }

    .bot li {
      margin-bottom: 4px;
    }

    .bot hr {
      border: 0;
      height: 1px;
      background: var(--border-color);
      margin: 16px 0;
    }

    .bot a {
      color: var(--accent);
      text-decoration: underline;
    }

    /* Tablas comparativas */
    .bot table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 13.5px;
      background: #0f172a;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .bot th, .bot td {
      padding: 10px 14px;
      text-align: left;
      border: 1px solid var(--border-color);
    }

    .bot th {
      background: #1e293b;
      color: var(--accent);
      font-weight: 600;
    }

    .bot tr:nth-child(even) {
      background: #131d31;
    }

    .input-box {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-panel);
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      background: var(--accent);
      color: #090d16;
      border: none;
      padding: 0 26px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s, opacity 0.2s;
    }

    button:hover {
      background: #7dd3fc;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Festival AI</h1>
      <p>Benchmarking de Festivales Publicitarios y Análisis de Casos</p>
    </header>

    <div id="chat">
      <div class="msg bot">Base de datos cargada. Puedes consultar patrones, categorías o solicitar comparativas directas entre piezas ganadoras y shortlists.</div>
    </div>

    <form class="input-box" id="form">
      <input type="text" id="pregunta" placeholder="Escribe tu consulta estratégica..." required autocomplete="off">
      <button type="submit" id="btn">Enviar</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('pregunta');
    const chat = document.getElementById('chat');
    const btn = document.getElementById('btn');

    form.onsubmit = async (e) => {
      e.preventDefault();
      const txt = input.value.trim();
      if (!txt) return;

      const userDiv = document.createElement('div');
      userDiv.className = 'msg user';
      userDiv.innerText = txt;
      chat.appendChild(userDiv);

      input.value = '';
      btn.disabled = true;
      chat.scrollTop = chat.scrollHeight;

      const loading = document.createElement('div');
      loading.className = 'msg bot';
      loading.innerText = 'Analizando base de datos y generando comparativa...';
      chat.appendChild(loading);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensaje: txt })
        });

        const rawText = await res.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch {
          throw new Error('El servidor excedió el tiempo de respuesta o devolvió un formato no válido.');
        }

        if (!res.ok) {
          loading.innerText = `Error (${res.status}): ${data.error || 'Fallo en la consulta.'}`;
        } else {
          loading.innerHTML = marked.parse(data.respuesta || 'Sin respuesta.');
        }
      } catch (err) {
        loading.innerText = `Error: ${err.message}`;
      }

      btn.disabled = false;
      chat.scrollTop = chat.scrollHeight;
    };
  </script>
</body>
</html>
